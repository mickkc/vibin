services:
  vibin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibin
    ports:
      - "8080:8080"
    volumes:
      - /opt/vibin/music:/opt/vibin/music
      - /opt/vibin/thumbnails:/opt/vibin/thumbnails
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      vibin_db:
        condition: service_healthy
    networks:
      - vibin_net

  vibin_db:
    image: postgres:18
    container_name: vibin_db
    env_file:
      - .env
    volumes:
      - /opt/vibin/db:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\" -d \"${POSTGRES_DB:-postgres}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vibin_net

networks:
  vibin_net:
