mails.new_sign_in.subject=Neue Anmeldung bei Vibin'
mails.new_sign_in.body=Du wurdest auf einem unbekannten Gerät angemeldet. Wenn du das selbst warst, kannst du diese E-Mail ignorieren. Falls nicht, klicke auf "Konto sichern", um dein Passwort zu ändern und die mit dieser Anmeldung verbundene Sitzung zu beenden. Um diesem Gerät zukünftig zu vertrauen, klicke auf "Diesem Gerät vertrauen".
mails.new_sign_in.buttons.secure_account=Konto sichern
mails.new_sign_in.buttons.trust_device=Diesem Gerät vertrauen

web.security.reset_password.title=Passwort zurücksetzen
web.security.reset_password.desc=Wenn du dein Passwort zurücksetzt, werden alle nicht-vertrauten Geräte abgemeldet.
web.security.reset_password.new.label=Neues Passwort
web.security.reset_password.repeat.label=Neues Passwort wiederholen
web.security.reset_password.button=Passwort zurücksetzen

web.security.trust_device.title=Gerät vertrauen
web.security.trust_device.desc=Wenn du diesem Gerät vertraust, wirst du keine E-Mail-Benachrichtigungen mehr erhalten, wenn sich von diesem Gerät aus mit deinem Account angemeldet wird.
web.security.trust_device.button=Gerät vertrauen

web.security.invalid_token.title=Ungültiger Link
web.security.invalid_token.desc=Dieser Link wurde entweder bereits benutzt, oder er existiert nicht auf diesem Server. Links in E-Mail-Benachrichtigungen laufen innerhalb von %s nach dem Versenden ab.

web.security.done.title=Fertig!
web.security.done.desc=Du kannst diesen Tab nun schließen.

web.security.error.title=Fehler!
