web.security.error.missing_confirm_password=Das neue Passwort wurde nicht bestätigt.
web.security.error.passwords_dont_match=Das Passwort stimmt nicht mit dem Bestätigungs-Passwort überein.
web.security.error.password_too_short=Das neue Passwort ist zu kurz. Es sollte mindestens 8 Zeichen enthalten.
web.security.error.server_error=Ein unbekannter Server-Fehler ist aufgetreten.
web.security.error.go_back=Zurück