Streamable:
  type: object
  properties:
    trackId:
      type: integer
      format: int64
      description: Track id
      example: 1
      nullable: false
    title:
      type: string
      example: "Never Gonna Give You Up"
      description: Track title
      nullable: false
    artist:
      type: string
      example: "Rick Astley, Another Artist"
      description: Track artists, seperated by commas
      nullable: false
    album:
      type: string
      example: "Whenever You Need Somebody"
      nullable: false
    duration:
      type: integer
      format: int64
      descripition: Track duration in milliseconds
      nullable: false
    volumeOffset:
      type: number
      format: double
      description: Volume offset for playback normalization
      nullable: true
    coverChecksum:
      type: string
      nullable: true
      description: The cover image file checksum
    coverSignatire:
      type: string
      nullable: true
      description: The cover image signature
    coverExpiration:
      type: integer
      format: int64
      nullable: true
      description: The cover image signature expiration timestamp
    streamSignature:
      type: string
      nullable: false
      description: The stream signature
    streamExpiration:
      type: integer
      format: int64
      nullable: false
      description: The stream signature expiration timestamp