LoginResult:
  type: object
  properties:
    success:
      type: boolean
    token:
      type: string
    user:
      $ref: 'user.yaml#/User'
    permissions:
      type: array
      items:
        type: string
    totpRequired:
      type: boolean
      description: If true, the session must be validated before usage using `POST /api/auth/totp`

Session:
  type: object
  properties:
    id:
      type: integer
      format: int64
      nullable: false
    deviceName:
      type: string
      nullable: false
      description: The name of the device this session was started on
    createdAt:
      type: integer
      format: int64
      nullable: false
      description: Unix timestamp in seconds
    lastUsed:
      type: integer
      format: int64
      nullable: true
      description: Unix timestamp in seconds