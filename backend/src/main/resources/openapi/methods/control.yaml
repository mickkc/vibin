PlayId:
  post:
    summary: Play a single track by ID
    operationId: playTrackById
    tags:
      - Control
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: The session ID, or "current" to use the last updated session
