      - name: trackId
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The track ID to play
        example: 1
    responses:
      200:
        description: Success. False if the message could not be sent (e.g. the websocket disconnected)
        content:
          application/json:
