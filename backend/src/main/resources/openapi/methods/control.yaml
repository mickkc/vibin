PlayQueuePos:
  post:
    summary: Skip to the track at the specified position inside the queue
    operationId: playTrackInQueue
    tags:
      - Control
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: The session ID, or "current" to use the last updated session
        example: current
      - name: pos
        in: query
        schema:
          type: integer
        required: true
        description: The 0-based index of the track in the queue to play
        example: 5
    responses:
      200:
        description: Success. False if the message could not be sent (e.g. the websocket disconnected)
        content:
          application/json:
            schema:
              $ref: '../models/success.yaml#/Success'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

SetRepeatMode:
  post:
    summary: Set the repeat mode for the playback session
    operationId: setRepeatMode
    tags:
      - Control
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: The session ID, or "current" to use the last updated session
        example: current
      - name: state
        in: query
        schema:
          type: string
          enum:
            - OFF
            - CURRENT_TRACK
            - ALL
        required: true
        description: The repeat mode
        example: 5
    responses:
      200:
        description: Success. False if the message could not be sent (e.g. the websocket disconnected)
        content:
          application/json:
            schema:
              $ref: '../models/success.yaml#/Success'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

