              $ref: '../models/success.yaml#/Success'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

SetQueue:
  post:
    summary: Update the entire queue and play a specific track
    operationId: setSpeed
    tags:
      - Control
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: The session ID, or "current" to use the last updated session
        example: current
      - name: ids
        in: query
        schema:
          type: string
        required: true
        description: The track ids, seperated by commas
        example: 1,4,5,23,13
      - name: audioType
        in: query
        schema:
          type: string
          enum:
            - album
            - playlist
            - artist
            - unspecified
        required: false
        description: The source of the tracks.
        example: album
        default: unspecified
      - name: audioTypeId
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: The id of the source album/playlist/artist, if any of those are set.
        example: 1
        default: null
      - name: shuffle
        in: query
        schema:
          type: boolean
        required: false
        description: If enabled, the tracks will be shuffled before adding them to the queue, and shuffling will be enabled.
          If disabled, the tracks will keep their order, and shuffling will be disabled. If not specified, the already set
          shuffling mode is kept.
        example: true
        default: null
      - name: startId
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: If specified, the track with this ID will be played first, even if shuffle is enabled.
        example: 5
        default: null

    responses:
      200:
        description: Success. False if the message could not be sent (e.g. the websocket disconnected)
        content:
          application/json:
            schema:
              $ref: '../models/success.yaml#/Success'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'