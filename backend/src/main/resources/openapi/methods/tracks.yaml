Base:
  get:
    summary: Get all tracks
    operationId: getTracks
    tags:
      - Tracks
    security:
      - tokenAuth: []
    parameters:
      - name: page
        in: query
        description: Page number (default is 1)
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of items per page (default is the configured page size)
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: Sort criteria
        required: false
        example: "TITLE"
        schema:
          type: string
          enum:
            - TITLE
            - RELEASE_YEAR
            - AUDIO_QUALITY
            - AUDIO_DURATION
            - LISTEN_DURATION
            - DATE_ADDED
            - DATE_MODIFIED
            - LAST_LISTENED_TO
            - RANDOM
      - name: dir
        in: query
        description: Sort direction
        required: false
        example: "ASC"
        schema:
          type: string
          enum:
            - ASC
            - DESC
    responses:
      200:
        description: A paginated list of minimal track info
        content:
          application/json:
            schema:
              $ref: '../models/paginations.yaml#/PaginatedMinimalTrackResponse'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Id:
  get:
    summary: Get track by ID
    operationId: getTrackById
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        description: ID of the track to retrieve
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: Track data
        content:
          application/json:
            schema:
              $ref: '../models/track.yaml#/Track'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

  put:
    summary: Updates a track
    operationId: updateTrack
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../models/track.yaml#/TrackEditData'
    responses:
      200:
        description: Track updated successfully
        content:
          application/json:
            schema:
              $ref: '../models/track.yaml#/Track'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

  delete:
    summary: Deletes a track
    operationId: deleteTrack
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        description: ID of the track to delete
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: Track deleted successfully
        content:
          application/json:
            schema:
              $ref: "../models/success.yaml#/Success"
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

ByArtist:
  get:
    summary: Get all tracks by a specific artist
    operationId: getTracksByArtist
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        description: ID of the artist
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: List of tracks by the artist
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../models/track.yaml#/Track'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Similar:
  get:
    summary: Get similar tracks
    operationId: getSimilarTracks
    tags:
      - Tracks
    security:
      - tokenAuth: []
    parameters:
      - name: id
        in: path
        description: ID of the track to find similar tracks for
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: List of similar tracks
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../models/track.yaml#/MinimalTrack'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Search:
  get:
    summary: Search for tracks
    operationId: searchTracks
    tags:
      - Tracks
    security:
      - tokenAuth: []
    parameters:
      - name: query
        in: query
        description: The search query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (default is 1)
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of items per page (default is the configured page size)
        required: false
        schema:
          type: integer
          format: int32
      - name: advanced
        in: query
        description: Whether to use advanced search (default is false)
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        description: Sort criteria
        required: false
        example: "TITLE"
        schema:
          type: string
          enum:
            - TITLE
            - RELEASE_YEAR
            - AUDIO_QUALITY
            - AUDIO_DURATION
            - LISTEN_DURATION
            - DATE_ADDED
            - DATE_MODIFIED
            - LAST_LISTENED_TO
            - RANDOM
      - name: dir
        in: query
        description: Sort direction
        required: false
        example: "ASC"
        schema:
          type: string
          enum:
            - ASC
            - DESC
    responses:
      200:
        description: List of tracks matching the search query
        content:
          application/json:
            schema:
              $ref: '../models/paginations.yaml#/PaginatedMinimalTrackResponse'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Random:
  get:
    summary: Get random tracks
    operationId: getRandomTracks
    tags:
      - Tracks
    security:
      - tokenAuth: []
    parameters:
      - name: limit
        in: query
        description: Number of random tracks to retrieve
        required: false
        schema:
          type: integer
          format: int32
          default: 1
    responses:
      200:
        description: List of random tracks
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../models/track.yaml#/MinimalTrack'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Newest:
  get:
    summary: Get the newest tracks
    operationId: getNewestTracks
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: limit
        in: query
        description: Number of newest tracks to retrieve
        required: false
        schema:
          type: integer
          format: int32
          default: 10
    responses:
      200:
        description: List of newest tracks
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../models/track.yaml#/MinimalTrack'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Download:
  get:
    summary: Download track file
    operationId: downloadTrackFile
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        description: ID of the track to download
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: Track file
        content:
          audio/any:
            schema:
              type: string
              format: binary
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Cover:
  get:
    summary: Get track cover image
    operationId: getTrackCover
    tags:
      - Tracks
    security:
      - tokenAuth: [ ]
    parameters:
      - name: id
        in: path
        description: ID of the track to retrieve the cover for
        required: true
        schema:
          type: integer
          format: int64
      - name: quality
        in: query
        description: The quality (width & height) of the image. 0 means the original quality.
        required: false
        default: 0
        schema:
          type: integer
    responses:
      200:
        description: Track cover image
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'