Check:
  get:
    summary: healthcheck endpoint
    operationId: checkHealth
    tags:
      - Healthcheck
    responses:
      200:
        description: Healthcheck successful
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: false
                  example: "ok"
                version:
                  type: string
                  example: "0.0.1"
                supportedAppVersions:
                  type: array
                  items:
                    type: string
                    example: "0.0.1"