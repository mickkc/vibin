Login:
  post:
    summary: User login
    operationId: loginUser
    tags:
      - Auth
    parameters:
      - name: username
        in: query
        description: Username of the user
        required: true
        schema:
          type: string
      - name: password
        in: query
        description: Password of the user
        required: true
        schema:
          type: string
      - name: deviceId
        in: query
        description: An id unique to the device the user is logging in on
        required: true
        schema:
          type: string
          maxLength: 32
      - name: deviceName
        in: query
        description: A human-readable name of the device the user is logging in on
        required: true
        schema:
          type: string
          maxLength: 255
    responses:
      200:
        description: Login result
        content:
          application/json:
            schema:
              $ref: '../models/auth.yaml#/LoginResult'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Logout:
  post:
    summary: User logout
    operationId: logoutUser
    tags:
      - Auth
    security:
      - tokenAuth: []
    responses:
      200:
        description: Logout successful
        content:
          application/json:
            schema:
              $ref: '../models/success.yaml#/Success'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

Validate:
  post:
    summary: Validate token
    operationId: validateToken
    tags:
      - Auth
    security:
      - tokenAuth: [ ]
    responses:
      200:
        description: Token is valid
        content:
          application/json:
            schema:
              $ref: '../models/auth.yaml#/LoginResult'
      401:
        description: Token is invalid or expired
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'

VerifyEmail:
  post:
    summary: Resend the verification email for the logged in user
    operationId: resendVerificationEmail
    tags:
      - Auth
    security:
      - tokenAuth: []
    responses:
      200:
        description: Mail was sent
        content:
          application/json:
            schema:
              $ref: '../models/success.yaml#/Success'
      409:
        description: Email address is already verified or invalid
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Conflict'
      503:
        description: SMTP is not configured
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Unavailable'
      429:
        description: Rate limited (too many mails sent)
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/RateLimited'
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: '../models/error.yaml#/Error'